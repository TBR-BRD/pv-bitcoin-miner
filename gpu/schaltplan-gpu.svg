<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="660" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">
    PV-Überschuss-Mining mit GPU-PC – Schalt- und Signalplan
  </text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#666">
    Leistung 230 V AC = durchgezogen · Daten/Steuerung (LAN/Internet) = gestrichelt blau
  </text>

  <!-- PV -->
  <rect x="40" y="100" width="150" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="115" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">PV-Module</text>
  <text x="115" y="149" text-anchor="middle" font-size="12" fill="#713f12">(Solargenerator)</text>

  <!-- Wechselrichter -->
  <rect x="40" y="232" width="150" height="66" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">Wechselrichter</text>
  <text x="115" y="281" text-anchor="middle" font-size="12" fill="#075985">DC → AC</text>

  <!-- Netz -->
  <rect x="300" y="62" width="180" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="390" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Öffentliches Netz</text>
  <text x="390" y="108" text-anchor="middle" font-size="12" fill="#5b21b6">Netzzähler</text>

  <!-- Hausverteilung mit Shelly -->
  <rect x="300" y="200" width="180" height="130" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="390" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Hausverteilung</text>
  <text x="390" y="245" text-anchor="middle" font-size="12" fill="#1e293b">Unterverteilung / Zähler</text>
  <rect x="320" y="262" width="140" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="282" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Shelly Pro 3EM</text>
  <text x="390" y="300" text-anchor="middle" font-size="11" fill="#166534">misst Netzbezug/-einspeisung</text>

  <!-- Hausverbraucher -->
  <rect x="300" y="402" width="180" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="390" y="429" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Hausverbraucher</text>
  <text x="390" y="448" text-anchor="middle" font-size="12" fill="#1e293b">übrige Lasten</text>

  <!-- Steckdose / Stromkreis -->
  <rect x="600" y="208" width="150" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="675" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Steckdose</text>
  <text x="675" y="251" text-anchor="middle" font-size="11" fill="#991b1b">abgesicherter Stromkreis,</text>
  <text x="675" y="265" text-anchor="middle" font-size="11" fill="#991b1b">nicht überlasten</text>

  <!-- Mining-PC -->
  <rect x="808" y="180" width="134" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="875" y="205" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a3412">Mining-PC</text>
  <text x="875" y="223" text-anchor="middle" font-size="12" fill="#9a3412">RTX 3070</text>
  <text x="875" y="242" text-anchor="middle" font-size="10.5" fill="#9a3412">Linux + lolMiner</text>
  <text x="875" y="258" text-anchor="middle" font-size="10.5" fill="#9a3412">pv-gpu-control.py</text>
  <text x="875" y="274" text-anchor="middle" font-size="10.5" fill="#9a3412">→ nvidia-smi</text>
  <text x="875" y="290" text-anchor="middle" font-size="10.5" fill="#9a3412">setzt Power-Limit</text>

  <!-- Router -->
  <rect x="600" y="430" width="150" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="675" y="457" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">Router / Switch</text>
  <text x="675" y="475" text-anchor="middle" font-size="11" fill="#1e40af">LAN</text>

  <!-- Mining-Pool -->
  <rect x="808" y="430" width="134" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="875" y="457" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Mining-Pool</text>
  <text x="875" y="475" text-anchor="middle" font-size="11" fill="#5b21b6">(Internet, Kaspa)</text>

  <!-- POWER LINES (solid) -->
  <line x1="115" y1="166" x2="115" y2="232" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="124" y="203" font-size="11" fill="#333">DC</text>
  <line x1="190" y1="265" x2="300" y2="265" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="214" y="257" font-size="11" fill="#333">AC</text>
  <line x1="390" y1="200" x2="390" y2="124" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="398" y="165" font-size="11" fill="#333">Bezug / Einspeisung</text>
  <line x1="390" y1="330" x2="390" y2="402" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="480" y1="240" x2="600" y2="240" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="750" y1="240" x2="808" y2="240" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- DATA LINES (dashed blue) -->
  <!-- Shelly -> Router -->
  <path d="M 390 314 L 390 382 L 600 382 L 600 430" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowD)"/>
  <text x="404" y="376" font-size="11" fill="#2563eb">LAN: PC liest Überschuss vom Shelly</text>
  <!-- Router -> PC (links an der Pool-Box vorbei) -->
  <path d="M 750 450 L 790 450 L 790 288 L 808 288" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowD)"/>
  <!-- Router -> Pool (Internet) -->
  <path d="M 750 468 L 808 468" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowD)"/>
  <text x="742" y="508" font-size="11" fill="#2563eb">Internet</text>

  <!-- Hinweisbox -->
  <rect x="40" y="540" width="880" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="567" font-size="13" font-weight="700" fill="#92400e">⚠ Hinweise</text>
  <text x="60" y="589" font-size="12" fill="#78350f">Der Mining-PC hängt an einer normalen Steckdose – auf ausreichend abgesicherten Stromkreis achten und</text>
  <text x="60" y="607" font-size="12" fill="#78350f">Mehrfachsteckdosen nicht überlasten. Der Shelly Pro 3EM ist ein Messgerät und schaltet keine Last direkt;</text>
  <text x="60" y="625" font-size="12" fill="#78350f">die Regelung erfolgt per Software auf dem PC (nvidia-smi setzt das GPU-Power-Limit nach dem Überschuss).</text>
</svg>
